<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0f2940">
  <meta name="description" content="上海子轩建筑科技集团有限公司 - 公司宣传与材料资源展示">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/img/favicon.svg">
  <link rel="apple-touch-icon" href="/img/favicon.svg">
  <title>上海子轩建筑科技集团有限公司</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body>
  <!-- 顶部导航 -->
  <header class="topbar" id="topbar">
    <button class="menu-btn" id="menuBtn" onclick="document.getElementById('sidebar').classList.add('open'); document.getElementById('backdrop').classList.add('show');" aria-label="打开菜单">
      <span></span><span></span><span></span>
    </button>
    <div class="brand" id="brand">
      <span class="brand-zh">上海子轩</span>
      <span class="brand-en">ZIXUAN</span>
    </div>
    <div class="topbar-actions">
      <a href="/admin/" class="admin-link" id="adminLink" title="管理后台">🔐 管理</a>
    </div>
  </header>

  <!-- 侧边导航 -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h2>导航</h2>
      <button class="close-btn" id="closeSidebar" onclick="document.getElementById('sidebar').classList.remove('open'); document.getElementById('backdrop').classList.remove('show');" aria-label="关闭">×</button>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"><!-- JS 注入 --></nav>
    <div class="sidebar-footer">
      <a href="/admin/" class="sidebar-admin-link">🔐 进入管理后台</a>
    </div>
  </aside>
  <div class="backdrop" id="backdrop"></div>

  <!-- 主内容区 -->
  <main class="main" id="main">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>正在加载公司信息...</p>
    </div>
  </main>

  <!-- 图片查看器 -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" id="lightboxClose" aria-label="关闭">×</button>
    <button class="lightbox-prev" id="lightboxPrev" aria-label="上一张">‹</button>
    <img id="lightboxImg" alt="">
    <button class="lightbox-next" id="lightboxNext" aria-label="下一张">›</button>
  </div>

  <!-- 安装PWA提示 -->
  <div class="install-tip" id="installTip" hidden>
    <span>📱 可将本应用安装到主屏幕，离线访问</span>
    <button id="installBtn">安装</button>
    <button id="installClose">×</button>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
  <script>
    // ==================== 终极兜底 ====================
    // 不管 app.js 是否执行成功，这里都能用
    (function emergencyInit() {
      // 1. 打开/关闭侧边菜单
      window.toggleSidebar = function(show) {
        const s = document.getElementById('sidebar');
        const b = document.getElementById('backdrop');
        if (s) {
          s.classList.toggle('open', show);
          s.style.transform = show ? 'translateX(0)' : '';
        }
        if (b) b.classList.toggle('show', show);
      };
      // 2. 切换板块
      window.goToSection = function(sectionId) {
        if (window.App && window.App.navigateTo) {
          window.App.navigateTo(sectionId);
        } else {
          location.hash = sectionId;
        }
        window.toggleSidebar(false);
      };
      // 3. 关闭安装提示
      window.dismissInstall = function() {
        const t = document.getElementById('installTip');
        if (t) t.hidden = true;
        try { localStorage.setItem('pwa_install_dismissed', '1'); } catch {}
      };
      // 4. 全局 click 委托（终极兜底）
      document.addEventListener('click', function(e) {
        const t = e.target;
        if (!t) return;
        if (t.id === 'menuBtn' || t.closest && t.closest('#menuBtn')) {
          e.preventDefault();
          window.toggleSidebar(true);
        } else if (t.id === 'closeSidebar' || t.closest && t.closest('#closeSidebar')) {
          e.preventDefault();
          window.toggleSidebar(false);
        } else if (t.id === 'backdrop') {
          window.toggleSidebar(false);
        } else if (t.id === 'installClose') {
          window.dismissInstall();
        } else {
          const nav = t.closest && t.closest('.sidebar-nav-item');
          if (nav) {
            e.preventDefault();
            const id = nav.dataset.section;
            if (id) window.goToSection(id);
          }
        }
      });
      console.log('✅ 紧急初始化完成');
    })();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.warn('SW 注册失败:', err.message));
      });
    }
  </script>
</body>
</html>
